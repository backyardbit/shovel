[package]
name = "shovel"
version = "0.1.0"
edition = "2021"
description = "Disposable macOS VMs for agents"

[[bin]]
name = "shovel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
des = "0.8"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
